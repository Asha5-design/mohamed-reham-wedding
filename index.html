<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة زفاف محمد وريهام</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:20px;
background:#f7eee9;color:#694b47;
font-family:Tahoma,Arial,sans-serif;text-align:center
}
.card{
width:100%;max-width:420px;background:#fffaf6;
border:1px solid #d8b9a9;padding:35px 22px;
box-shadow:0 8px 30px #8a62531c
}
.ornament{font-size:28px;color:#b48b78}
h1{font-size:34px;font-weight:normal;margin:22px 0}
p{line-height:2;font-size:16px}
.names{font-size:27px;color:#a47768;margin:25px 0}
button{
border:0;background:#a47768;color:white;padding:14px 25px;
font-size:17px;border-radius:3px;cursor:pointer
}
#details{display:none;margin-top:22px}
</style>
</head>
<body>
<main class="card">
<div class="ornament">❦</div>
<p>بكل الحب والسعادة</p>
<h1>دعوة زفاف</h1>
<p>يسعدنا دعوتكم لمشاركتنا أجمل لحظات العمر</p>
<div class="names">محمد ♡ ريهام</div>
<button onclick="document.getElementById('details').style.display='block';this.style.display='none'">
افتحوا الدعوة ♡
</button>
<div id="details">
<p>الخميس 22 أكتوبر 2026</p>
<p>الساعة الثامنة مساءً</p>
<p>قاعة لاروز</p>
<p>وجودكم يكمل فرحتنا ♡</p>
</div>
<div class="ornament">❦</div>
</main>
</body>
</html>
